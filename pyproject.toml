[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-memory-kit"
version = "0.1.0"
description = "Portable, evidence-backed codebase exploration and engineering memory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
emkit = "emkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emkit = [
    "resources/*.md",
    "resources/*.json",
    "resources/templates/*.md",
]
